<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="m-grad-primary" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="m-grad-glow" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="m-platter-1" x1="8" y1="28" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="m-platter-2" x1="8" y1="20" x2="40" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="m-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="24" cy="24" r="20" fill="url(#m-grad-glow)" opacity="0.15" filter="url(#m-glow-filter)"/>

  <!-- Storage Chassis Shield (Isometric Hexagon Container) -->
  <path d="M24 4L42 14V34L24 44L6 34V14L24 4Z" fill="#090d16" stroke="url(#m-grad-primary)" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Lower Storage Platter (Hardware Tier 3) -->
  <path d="M12 28L24 34L36 28L24 22L12 28Z" fill="url(#m-platter-1)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6"/>
  <path d="M12 28V31L24 37L36 31V28L24 34L12 28Z" fill="#090d16" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Middle Storage Platter (Hardware Tier 2) -->
  <path d="M12 22L24 28L36 22L24 16L12 22Z" fill="url(#m-platter-2)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.7"/>
  <path d="M12 22V25L24 31L36 25V22L24 28L12 22Z" fill="#0f172a" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Upper Storage Surface with Stylized 'M' Network Traces -->
  <!-- Left Leg of M -->
  <path d="M16 19L20 14V23L16 25V19Z" fill="url(#m-grad-primary)"/>
  <!-- Middle Peak Left -->
  <path d="M20 14L24 19L28 14L24 10L20 14Z" fill="#67e8f9" filter="url(#m-glow-filter)"/>
  <!-- Right Leg of M -->
  <path d="M32 19L28 14V23L32 25V19Z" fill="url(#m-grad-primary)"/>
  <!-- Center Core V of M -->
  <path d="M24 19L20 23L24 26L28 23L24 19Z" fill="#38bdf8"/>

  <!-- Network Circuit Node Lights -->
  <circle cx="24" cy="10" r="1.8" fill="#38bdf8" filter="url(#m-glow-filter)"/>
  <circle cx="24" cy="10" r="1" fill="#ffffff"/>

  <circle cx="16" cy="19" r="1.4" fill="#34d399"/>
  <circle cx="32" cy="19" r="1.4" fill="#34d399"/>

  <circle cx="24" cy="38" r="1.4" fill="#38bdf8"/>
</svg>

