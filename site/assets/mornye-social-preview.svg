<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="mesh-1" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-2" cx="80%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#0e3a5f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian luxury background -->
  <rect width="1280" height="640" fill="#030712"/>
  <rect width="1280" height="640" fill="url(#mesh-1)"/>
  <rect width="1280" height="640" fill="url(#mesh-2)"/>

  <!-- Subtle grid pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Outer frame border with glowing accent -->
  <rect x="24" y="24" width="1232" height="592" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="26" y="26" width="1228" height="590" rx="18" fill="none" stroke="url(#neon-cyan)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Brand Emblem (top left) -->
  <g transform="translate(72, 70)">
    <path d="M40 6L70 23V57L40 74L10 57V23L40 6Z" fill="#090d16" stroke="url(#neon-cyan)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M20 48L40 58L60 48L40 38L20 48Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <path d="M20 38L40 48L60 38L40 28L20 38Z" fill="#334155" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- M paths -->
    <path d="M26 32L34 23V39L26 43V32Z" fill="url(#neon-cyan)"/>
    <path d="M34 23L40 31L46 23L40 17L34 23Z" fill="#67e8f9" filter="url(#soft-glow)"/>
    <path d="M54 32L46 23V39L54 43V32Z" fill="url(#neon-cyan)"/>
    <circle cx="40" cy="17" r="3" fill="#ffffff"/>
    <circle cx="26" cy="32" r="2.2" fill="#34d399"/>
    <circle cx="54" cy="32" r="2.2" fill="#34d399"/>
  </g>

  <!-- Release Pill -->
  <g transform="translate(170, 85)">
    <rect width="180" height="34" rx="17" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#34d399"/>
    <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.08em">PRODUCTION v3.3.0</text>
  </g>

  <!-- Main Headline -->
  <text x="72" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.03em">Mornye Network Storage</text>

  <!-- Tagline -->
  <text x="72" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="-0.01em">
    Enterprise-Grade Private Cloud Storage &amp; RFC 4918 WebDAV Server for Linux
  </text>
  <text x="72" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#64748b">
    Rootless Docker &bull; Argon2id Cryptography &bull; Automated Cloudflare Zero-Trust Subdomains &bull; Self-Healing Diagnostics
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(72, 345)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="185" height="38" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">&#9881; RFC 4918 WebDAV</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="180" height="38" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
    <text x="218" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">&#128274; Argon2id Hash</text>

    <!-- Pill 3 -->
    <rect x="395" y="0" width="195" height="38" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="413" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">&#128051; Rootless UID 1000</text>

    <!-- Pill 4 -->
    <rect x="605" y="0" width="225" height="38" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <text x="623" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">&#9729; Cloudflare Tunnel Edge</text>

    <!-- Pill 5 -->
    <rect x="845" y="0" width="170" height="38" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(236,72,153,0.3)" stroke-width="1"/>
    <text x="863" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">&#129658; Auto-Healing CLI</text>
  </g>

  <!-- Quickstart Terminal Box -->
  <g transform="translate(72, 420)">
    <rect width="1136" height="74" rx="14" fill="rgba(8,13,26,0.95)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Terminal dots -->
    <circle cx="28" cy="37" r="5" fill="#ef4444"/>
    <circle cx="44" cy="37" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="37" r="5" fill="#10b981"/>
    
    <text x="90" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" fill="#34d399" font-weight="700">$</text>
    <text x="110" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" fill="#f1f5f9">curl -fsSL https://raw.githubusercontent.com/navyaXdev/Mornye-Network-Storage/main/setup.sh | bash</text>

    <rect x="1030" y="20" width="80" height="34" rx="8" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
    <text x="1052" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">COPY</text>
  </g>

  <!-- Footer attribution -->
  <text x="72" y="565" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">
    Created and Engineered by <tspan fill="#38bdf8" font-weight="700">NavyaXdev</tspan> &bull; MIT License &bull; Open-Source
  </text>
  <text x="1208" y="565" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#64748b" text-anchor="end">
    https://mornye-network-project.navya.dpdns.org/
  </text>
</svg>

