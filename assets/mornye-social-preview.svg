<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Mornye Network Storage Social Preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- Geometric Grid & Network Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Glowing Accent Curves -->
  <path d="M-100 500 Q 300 200, 700 450 T 1380 150" fill="none" stroke="url(#cyan-glow)" stroke-width="3" opacity="0.3" />
  <path d="M-100 550 Q 400 350, 800 550 T 1380 300" fill="none" stroke="url(#cyan-glow)" stroke-width="2" opacity="0.2" />

  <!-- Center Card -->
  <rect x="80" y="60" width="1120" height="520" rx="24" fill="url(#card-grad)" stroke="#374151" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Top Accent Bar -->
  <rect x="80" y="60" width="1120" height="6" rx="3" fill="url(#cyan-glow)" />

  <!-- Storage / Server Icon -->
  <g transform="translate(140, 120)">
    <!-- Server Stack Outer -->
    <rect x="0" y="0" width="72" height="22" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
    <circle cx="14" cy="11" r="3" fill="#10b981" />
    <circle cx="26" cy="11" r="3" fill="#3b82f6" />
    <line x1="42" y1="11" x2="60" y2="11" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <rect x="0" y="28" width="72" height="22" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <circle cx="14" cy="39" r="3" fill="#10b981" />
    <circle cx="26" cy="39" r="3" fill="#3b82f6" />
    <line x1="42" y1="39" x2="60" y2="39" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <rect x="0" y="56" width="72" height="22" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="14" cy="67" r="3" fill="#10b981" />
    <circle cx="26" cy="67" r="3" fill="#3b82f6" />
    <line x1="42" y1="67" x2="60" y2="67" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Title -->
  <text x="235" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#06b6d4" letter-spacing="3">OPEN-SOURCE LINUX INFRASTRUCTURE</text>
  <text x="235" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Mornye Network Storage</text>

  <!-- Tagline / Subtitle -->
  <text x="140" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Enterprise-Grade Private Storage &amp; RFC 4918 WebDAV Server for Linux
  </text>
  <text x="140" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748b">
    Docker Runtime • Zero-Trust Cloudflare Ingress • Argon2id Auth • Flat Physical Storage
  </text>

  <!-- Feature Badge Row 1 -->
  <g transform="translate(140, 345)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="180" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="90" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ RFC 4918 WebDAV</text>

    <!-- Badge 2 -->
    <rect x="195" y="0" width="170" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="280" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#60a5fa" text-anchor="middle">🐳 Docker &amp; Compose</text>

    <!-- Badge 3 -->
    <rect x="380" y="0" width="220" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="490" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f59e0b" text-anchor="middle">☁️ Cloudflare Zero-Trust</text>

    <!-- Badge 4 -->
    <rect x="615" y="0" width="170" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="700" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#34d399" text-anchor="middle">🔒 Argon2id Security</text>

    <!-- Badge 5 -->
    <rect x="800" y="0" width="195" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="897" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a78bfa" text-anchor="middle">📦 8 Linux Distros</text>
  </g>

  <!-- Feature Badge Row 2 / Command Snippet -->
  <g transform="translate(140, 410)">
    <rect x="0" y="0" width="995" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="30" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#38bdf8">$</text>
    <text x="40" y="30" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#e2e8f0">git clone https://github.com/navyaXdev/Mornye-Network-Storage &amp;&amp; ./setup.sh</text>
    <text x="965" y="30" font-family="'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#64748b" text-anchor="end">v3.3.0</text>
  </g>

  <!-- Divider -->
  <line x1="140" y1="485" x2="1135" y2="485" stroke="#1e293b" stroke-width="1" />

  <!-- Footer Information -->
  <text x="140" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
    Developed by <tspan font-weight="700" fill="#f8fafc">NavyaXdev</tspan> • Free &amp; Open-Source under MIT License
  </text>
  <text x="1135" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#64748b" text-anchor="end">
    github.com/navyaXdev/Mornye-Network-Storage
  </text>
</svg>

